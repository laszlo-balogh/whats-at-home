services:
  db:
    image: postgres:17
    container_name: whatsathome-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsathome
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: whatsathome
    ports:
      - "5433:5432"
    volumes:
      - whatsathome-pgdata:/var/lib/postgresql/data

volumes:
  whatsathome-pgdata: